{% extends "base.html" %}
{% block title %}登录 · {{ APP_NAME }}{% endblock %}
{% block bodyclass %}anon{% endblock %}
{% block anon %}
<div class="loginwrap">
  <form class="loginbox" method="post" action="{{ P }}/login">
    <h1>公众号 Agent 工作台</h1>
    <p class="sub">选题 · 写作 · 排版 · 建草稿</p>
    {% if error %}<div class="alert err">{{ error }}</div>{% endif %}
    <label class="f"><span>用户名</span>
      <input type="text" name="username" autocomplete="username" autofocus required />
    </label>
    <label class="f"><span>密码</span>
      <input type="password" name="password" autocomplete="current-password" required />
    </label>
    <button class="primary" style="width:100%;margin-top:6px" type="submit">登录</button>
    <p class="note" style="margin-top:16px">
      首次启动时会在日志里打印初始账号密码，可以用环境变量
      <code>WXWB_ADMIN_PASSWORD</code> 指定。
    </p>
  </form>
</div>
{% endblock %}
